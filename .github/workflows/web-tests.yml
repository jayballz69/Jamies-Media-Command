name: Web app tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-web.txt pytest==8.4.2
      - name: Run all web tests with pytest
        run: python -m pytest tests/test_web_*.py -q
